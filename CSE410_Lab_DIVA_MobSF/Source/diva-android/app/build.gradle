apply plugin: 'com.android.application'

android {
    namespace 'jakhar.aseem.diva'
    compileSdk 34
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "jakhar.aseem.diva"
        // Original DIVA SDK levels kept so the assessment target behaves as designed.
        minSdkVersion 15
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    // Prebuilt native libraries produced by `make` in app/src/main/jni live in src/main/jniLibs.
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.4.0'
}
